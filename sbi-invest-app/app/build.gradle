plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pinori.investdashboard'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pinori.investdashboard'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '3.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
