<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>ポケピーノ</title>
<style>
:root{--bg:#fffaf0;--card:#fff;--ink:#26334a;--sub:#778398;--red:#e95d57;--teal:#178e88;--border:#e9e7e4}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;margin:0;background:var(--bg);color:var(--ink);font-size:14px}header{position:sticky;top:0;z-index:3;background:#fff1df;box-shadow:0 2px 12px #c9863214;padding:13px 17px 11px}header .logo{font-size:24px;font-weight:900;letter-spacing:-.06em}header .tag{color:#856f59;font-size:11px;margin-top:2px}main{padding:14px 12px 92px;max-width:780px;margin:auto}nav{position:fixed;z-index:5;bottom:0;left:0;right:0;display:flex;background:white;border-top:1px solid var(--border);padding:8px 8px max(11px,env(safe-area-inset-bottom));justify-content:space-around}nav button{border:0;background:transparent;color:var(--sub);font-size:11px;padding:5px 7px;border-radius:10px;flex:1;min-width:0}nav button strong{display:block;font-size:23px;line-height:28px}nav button.active{color:var(--red);background:#fff1ed;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:15px}.stat{background:#fff;padding:10px 7px;border-radius:14px;box-shadow:0 2px 12px #00000007;text-align:center}.stat .num{font-size:22px;font-weight:900}.stat small{display:block;font-size:10px;color:var(--sub);white-space:nowrap}.search{border:1.5px solid #e8daca;border-radius:14px;width:100%;padding:14px;background:white;font-size:16px;outline:none}.search:focus{border-color:var(--red)}.filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:12px 0}.pill{border:1px solid #ddd7d1;padding:7px 11px;border-radius:30px;background:white;color:#656b75;font-size:12px}.pill.active{background:var(--red);border-color:var(--red);color:white;font-weight:800}.pill.secondary.active{background:var(--teal);border-color:var(--teal)}.info{display:flex;justify-content:space-between;align-items:center;margin:8px 1px;color:var(--sub);font-size:12px}.link{border:none;background:none;color:var(--teal);font-weight:700;font-size:12px;padding:8px 4px;cursor:pointer}.group{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid #f0efeb;border-radius:16px;padding:9px 12px;margin-bottom:8px;min-height:88px;box-shadow:0 3px 10px #00000005;cursor:pointer}.group .name{font-weight:850;font-size:16px}.group .meta{font-size:12px;color:var(--sub);margin-top:5px}.thumb{width:76px;height:76px;flex:0 0 76px;border-radius:12px;background:#f3f6f8;object-fit:contain;display:block}.thumb.big{width:112px;height:112px;flex-basis:112px}.group .arrow{color:var(--sub);font-size:26px;margin-left:auto}.bar{display:flex;align-items:center;gap:12px;margin-bottom:12px}.bar h2{font-size:19px;margin:0}.count{font-size:13px;color:var(--sub);margin-bottom:12px}.record{background:#fff;border-radius:17px;border:1px solid #eeeae3;box-shadow:0 2px 15px #00000008;margin:0 0 11px;padding:13px}.product{display:flex;align-items:flex-start;gap:12px}.product .description{flex:1;min-width:0}.record h3{font-size:15px;margin:0 0 7px;line-height:1.5}.record .series{font-size:12px;color:#576479;line-height:1.4}.record .year{font-size:12px;color:#778398;margin-top:5px}.flag{font-size:11px;margin:7px 0 0;color:var(--teal);font-weight:700}.flag.ref{color:#997620}.explain{font-size:10px;color:#9b9daa;margin:6px 0 8px}.actions{display:flex;align-items:center;gap:7px;border-top:1px solid #eee;padding-top:10px}.owned{margin-right:auto;font-weight:750;color:var(--teal)}.owned.missing{color:var(--sub);font-weight:500}.smallBtn{border-radius:10px;border:1px solid #f0e1dc;background:#fff5f1;color:var(--red);min-width:40px;height:36px;font-size:23px;cursor:pointer}.smallBtn.add{background:var(--red);color:white;border-color:var(--red)}.smallBtn:disabled{opacity:.35}.footer{text-align:right;margin-top:5px}.empty{text-align:center;color:var(--sub);padding:30px 12px}.muted{color:var(--sub)}.legal{font-size:11px;line-height:1.5;color:#9a9aa0;background:#fffcf5;padding:11px;border-radius:12px;margin-bottom:13px}.upcoming{color:#a36c10!important}.hidden{display:none!important}
.gallery{padding:10px 0}.gallery-info{font-size:11px;color:#66778a;padding:8px;background:#f7fafb;border-radius:8px}.gallery-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.gallery-image{display:flex;flex-direction:column;align-items:center;gap:5px;padding:5px;border:1px solid #e9e7e4;border-radius:9px;background:#fff;color:#188b84;font-size:11px}.gallery-image img{width:100%;height:130px;object-fit:contain;background:#f5f6f8}
</style></head><body>
<header><div class="logo">ポケピーノ <span style="font-size:19px">📒</span></div><div class="tag">歴代ポケモンキッズ・コレクション図鑑</div></header>
<main id="screen"><div class="empty">図鑑を読み込み中…</div></main>
<nav><button id="nav-dex" class="active" onclick="switchTab('dex')"><strong>▦</strong>図鑑</button><button id="nav-owned" onclick="switchTab('owned')"><strong>✓</strong>所持</button><button id="nav-scan" onclick="openScanner()"><strong>📷</strong>スキャン</button><button onclick="switchTab('about')"><strong>ⓘ</strong>使い方</button></nav>
<script>
'use strict';
const N = window.Native || {getCatalog:()=> '[]',getOwned:()=> '{}',setOwned:()=>{},openOfficial:()=>{}};
let galleries={}, chosen={}, galleryOpen='', records=[], owned={}, view='dex', selected='', term='', filter='all', onlyOfficial=false, newest=true, displayLimit=100, isComposing=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getCount=r=>Number(owned[r[0]]||0);
const isOfficial=r=>r[6]==='official'||r[6]==='planned';
const groupKey=r=>r[1]>0?'n'+r[1]:'p'+r[2];
function releaseImages(r){const obj=galleries.series&&galleries.series[r[8]];return obj&&Array.isArray(obj.images)?obj.images:[];}
function pictureKind(r){return chosen[r[0]]?'selected':r[7]?'reference':'illustration';}
function art(r){return chosen[r[0]]||r[7]|| (r[1]>0&&r[1]<=1025?'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/'+r[1]+'.png':'');}
function imageFailed(el){const d=document.createElement('div');d.className=el.className;d.textContent='画像読込失敗';d.style.display='grid';d.style.placeItems='center';el.replaceWith(d);}
function image(r,large=false){const u=art(r);return u?'<img class="thumb '+(large?'big':'')+'" loading="lazy" referrerpolicy="no-referrer" src="'+esc(u)+'" onerror="imageFailed(this)">':'<div class="thumb '+(large?'big':'')+'" style="display:grid;place-items:center;color:#aaa">画像なし</div>';}
function recordVisible(r){return (!onlyOfficial||isOfficial(r))&&(filter==='all'||filter==='missing'&&getCount(r)===0||filter==='owned'&&getCount(r)>0);}
function countOwned(){return records.filter(r=>getCount(r)>0).length;}
function updateNav(){document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));const id=view==='owned'?'nav-owned':'nav-dex';if(view!=='about')$('#'+id).classList.add('active');}
function switchTab(t){view=t;selected='';displayLimit=100;render();window.scrollTo(0,0);}
function openScanner(){if(N.openScanner)N.openScanner();}
function onSearch(v){term=v;displayLimit=100;render(false);const input=$('#query');if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length);}}
function setFilter(v){filter=v;displayLimit=100;render();}
function toggleOfficial(){onlyOfficial=!onlyOfficial;render();}
function toggleSort(){newest=!newest;render();}
function showGroup(k){selected=k;render();window.scrollTo(0,0);}
function backToDex(){selected='';render();window.scrollTo(0,0);}
window.goBackFromAndroid=function(){if(selected){backToDex();return true;}if(view!=='dex'){switchTab('dex');return true;}return false;};
function changeCount(id,delta){const next=Math.max(0,Math.min(999,Number(owned[id]||0)+delta));owned[id]=next;N.setOwned(id,next);render();}
function chooseGallery(id){galleryOpen=galleryOpen===id?'':id;render();}
function setGalleryPicture(id,idx){const r=records.find(x=>x[0]===id);if(!r)return;const url=releaseImages(r)[idx];if(!url)return;chosen[id]=url;if(N.setPickedPhoto)N.setPickedPhoto(id,url);galleryOpen='';render();}
function galleryPanel(r){if(galleryOpen!==r[0])return '';const imgs=releaseImages(r);if(!imgs.length)return '';return '<div class="gallery"><p class="gallery-info">この商品が写っている画像を選んでください。シリーズ集合写真も含むため、正面写真・造形の一致は自分で確認してください。</p><div class="gallery-list">'+imgs.map((u,i)=>'<button class="gallery-image" data-id="'+esc(r[0])+'" data-index="'+i+'" onclick="setGalleryPicture(this.dataset.id,Number(this.dataset.index))"><img loading="lazy" referrerpolicy="no-referrer" src="'+esc(u)+'"><span>この画像を選ぶ</span></button>').join('')+'</div></div>';}
function referenceLink(u){if(u && u.startsWith('https://www.yubi-nin.jp/pokemon/'))N.openReference(u);}
function formWords(v){return /メガ|フォルム|フォーム|すがた|クリア|テラスタル|《|なみのり|お祝い|アーマード|キョダイ|ポーズ|色違い|郵便屋/.test(String(v));}
function officialLink(u){if(u&&u.indexOf('https://www.bandai.co.jp/candy/')===0)N.openOfficial(u);}
const button=(label,active,fn,extra='')=>'<button class="pill '+(active?'active ':'')+extra+'" onclick="'+fn+'">'+label+'</button>';
function filters(){return '<div class="filters">'+button('全部',filter==='all',"setFilter('all')")+button('未所持',filter==='missing',"setFilter('missing')")+button('所持',filter==='owned',"setFilter('owned')")+button('公式のみ',onlyOfficial,'toggleOfficial()','secondary')+'</div>';}
function stats(){const oc=records.filter(isOfficial);return '<div class="stats"><div class="stat"><small>所持済み</small><div class="num">'+countOwned()+'</div></div><div class="stat"><small>未所持</small><div class="num">'+(records.length-countOwned())+'</div></div><div class="stat"><small>公式確認済</small><div class="num">'+oc.filter(r=>getCount(r)>0).length+'<span style="font-size:12px">/'+oc.length+'</span></div></div></div>';}
function searchMatch(r){const q=term.trim().toLocaleLowerCase();return !q||[r[1],r[2],r[3],r[4],r[5]].join(' ').toLocaleLowerCase().includes(q);}
function sorted(arr){return arr.slice().sort((a,b)=>{let cmp=String(a[5]).localeCompare(String(b[5]));return (newest?-1:1)*cmp||String(a[2]).localeCompare(String(b[2]),'ja');});}
function groupRow(key,list){let r=list[0];const n=list.filter(x=>getCount(x)>0).length;const max=sorted(list)[0];const forms=list.filter(x=>formWords(x[3])).length;const future=list.filter(x=>x[6]==='planned').length;return '<div class="group" data-key="'+esc(key)+'" onclick="showGroup(this.dataset.key)">'+image(max)+'<div><div class="name">'+esc(r[2])+'</div><div class="meta">発売候補 '+list.length+'件（形・色などの違い表記 '+forms+'件）</div><div class="meta">所持 '+n+'件'+(future?' / 発売予定 '+future+'件':'')+'</div><div class="meta">'+(r[1]>0?'全国図鑑 No.'+String(r[1]).padStart(3,'0'):'特別・関連商品')+'</div></div><div class="arrow">›</div></div>';}
function productCard(r){
const n=getCount(r),status=r[6],u=r[8],photo=art(r),kind=pictureKind(r);
const note=kind==='selected'?'公式ギャラリーから選択した画像（向き・個体は要確認）':kind==='reference'?'参考サイトの実物写真（正面・造形の一致は未検証）':photo?'ポケモンの参考イラスト（実物の画像ではありません）':'実物写真が未収録です';
const year=esc(r[5]||'発売年不明')+((r[5]||'').includes('–')?'（年代目安）':'');
const flag=status==='official'?'● 公式ラインナップ確認済':status==='planned'?'● 公式発表・発売予定':status==='legacy_unverified'?'△ 旧版の仮登録（発売商品として未確定）':'△ 歴代参考資料・個別商品確認待ち';
const links=(u&&u.startsWith('https://www.bandai.co.jp/candy/'))?'<div class="footer"><button class="link" data-url="'+esc(u)+'" onclick="officialLink(this.dataset.url)">公式商品ページ ↗</button>'+(releaseImages(r).length?'<button class="link" data-id="'+esc(r[0])+'" onclick="chooseGallery(this.dataset.id)">掲載写真を選ぶ（'+releaseImages(r).length+'枚）</button>':'')+'</div>'+galleryPanel(r):(u&&u.startsWith('https://www.yubi-nin.jp/pokemon/'))?'<div class="footer"><button class="link" data-url="'+esc(u)+'" onclick="referenceLink(this.dataset.url)">参考図鑑で写真を見る ↗</button></div>':'';
return '<article class="record"><div class="product">'+image(r,true)+'<div class="description"><h3>'+esc(r[3]||r[2])+'</h3><div class="series">'+esc(r[4])+'</div><div class="year">'+year+'</div><div class="flag '+(status==='reference'?'ref':'')+' '+(status==='planned'?'upcoming':'')+'">'+flag+'</div></div></div><p class="explain">'+esc(note)+'</p><div class="actions"><span class="owned '+(n?'':'missing')+'">'+(n?'✓ 所持 ×'+n:'○ 未所持')+'</span><button class="smallBtn" '+(n?'':'disabled')+' data-id="'+esc(r[0])+'" onclick="changeCount(this.dataset.id,-1)">−</button><button class="smallBtn add" data-id="'+esc(r[0])+'" onclick="changeCount(this.dataset.id,1)">＋</button></div>'+links+'</article>';
}
function render(focusRestore){updateNav();const el=$('#screen');if(view==='about') {el.innerHTML='<h2>ポケピーノについて</h2><div class="record">ポケモンを名前で探し、同じポケモンの発売年・フォルム・造形違いを選んで「＋」を押すだけで所持登録できます。<p>「未所持」と「公式のみ」は組み合わせ可能です。所持数は端末内に保存されます。インターネット不要で名前と記録を使えますが、画像表示・公式ページ閲覧には通信が必要です。写真判定は下部の「スキャン」から使えます。現時点では判定画面と図鑑の所持登録は別操作です。</p><p>公式確認済み：バンダイの発売ラインナップで確認した商品。参考データ：以前の図鑑由来の候補で、正確な型式・発売年は未確認です。参考件数はコンプリート率として扱わないでください。</p><p>当アプリは個人用の非公式コレクション管理ツールです。バンダイ、任天堂、ポケモンの公式アプリではありません。</p></div>';return;}
if(view==='owned'&&!selected){const arr=sorted(records.filter(r=>getCount(r)>0));el.innerHTML='<h2>所持リスト</h2><p class="count">'+arr.length+' 種を登録済み / 個数の変更もできます</p>'+arr.slice(0,displayLimit).map(productCard).join('')+(arr.length>displayLimit?'<button class="pill" onclick="more()">さらに表示</button>':'')+(arr.length===0?'<div class="empty">まだ登録されていません。図鑑で「＋」を押して登録してね。</div>':'');return;}
if(selected){const list=sorted(records.filter(r=>groupKey(r)===selected));const visible=list.filter(r=>recordVisible(r)&&searchMatch(r));el.innerHTML='<div class="bar"><button class="pill" onclick="backToDex()">← 戻る</button><h2>'+esc(list[0]?.[2]||'商品詳細')+'</h2></div>'+filters()+'<div class="count">条件に一致 '+visible.length+' 件 / 全 '+list.length+' 件</div>'+visible.slice(0,displayLimit).map(productCard).join('')+(visible.length>displayLimit?'<button class="pill" onclick="more()">さらに表示</button>':'')+(visible.length===0?'<div class="empty">条件に合う商品はありません。</div>':'');return;}
const matched=records.filter(r=>recordVisible(r)&&searchMatch(r));const group=new Map();for(const r of matched){const k=groupKey(r);if(!group.has(k))group.set(k,[]);group.get(k).push(r);}const gs=Array.from(group.entries()).sort((a,b)=>{const x=sorted(a[1])[0],y=sorted(b[1])[0];return (newest?-1:1)*String(x[5]).localeCompare(String(y[5]))||String(a[1][0][2]).localeCompare(String(b[1][0][2]),'ja');});
el.innerHTML=stats()+'<input id="query" class="search" type="search" autocomplete="off" placeholder="🔎 ポケモン名・フォルム・発売年" value="'+esc(term)+'" oncompositionstart="isComposing=true" oncompositionend="isComposing=false;onSearch(this.value)" oninput="if(!isComposing)onSearch(this.value)">'+filters()+'<div class="info"><span>'+records.length+' 件収録（参考を含む）・ '+gs.length+' 件表示対象</span><button class="link" onclick="toggleSort()">'+(newest?'新しい順 ▼':'古い順 ▲')+'</button></div><div class="legal">正面・色違い・復刻を含む発売候補件数。見た目が同じ再販も別発売と数える。参考資料の写真は個体一致・正面角度を全件確認済みではありません。</div>'+gs.slice(0,displayLimit).map(([k,list])=>groupRow(k,list)).join('')+(gs.length>displayLimit?'<button class="pill" onclick="more()">さらに表示 ＋</button>':'')+(gs.length===0?'<div class="empty">該当する商品がありません。検索条件を変更してみてね。</div>':'');
}
function more(){displayLimit+=100;render();}
function boot(){try{records=JSON.parse(N.getCatalog());owned=JSON.parse(N.getOwned());galleries=JSON.parse(N.getGalleries ? N.getGalleries() : '{}');chosen=JSON.parse(N.getPickedPhotos ? N.getPickedPhotos() : '{}');render();}catch(e){$('#screen').textContent='図鑑の読み込みに失敗しました: '+e.message;}}
boot();
</script></body></html>
