<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ポケピーノ</title>
<style>
:root{--bg:#fffaf0;--card:#fff;--ink:#26334a;--sub:#778398;--red:#e95d57;--teal:#178e88;--border:#e9e7e4}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;margin:0;background:var(--bg);color:var(--ink);font-size:14px}header{position:sticky;top:0;z-index:3;background:#fff1df;box-shadow:0 2px 12px #c9863214;padding:13px 17px 11px}header .logo{font-size:24px;font-weight:900;letter-spacing:-.06em}header .tag{color:#856f59;font-size:11px;margin-top:2px}main{padding:14px 12px 92px;max-width:780px;margin:auto}nav{position:fixed;z-index:5;bottom:0;left:0;right:0;display:flex;background:white;border-top:1px solid var(--border);padding:8px 8px max(11px,env(safe-area-inset-bottom));justify-content:space-around}nav button{border:0;background:transparent;color:var(--sub);font-size:13px;padding:5px 7px;border-radius:10px;flex:1;min-width:0}nav button strong{display:block;font-size:23px;line-height:28px}nav button.active{color:var(--red);background:#fff1ed;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:15px}.stat{background:#fff;padding:10px 7px;border-radius:14px;box-shadow:0 2px 12px #00000007;text-align:center}.stat .num{font-size:22px;font-weight:900}.stat small{display:block;font-size:10px;color:var(--sub);white-space:nowrap}.search{border:1.5px solid #e8daca;border-radius:14px;width:100%;padding:14px;background:white;font-size:16px;outline:none}.search:focus{border-color:var(--red)}.headRow{display:flex;align-items:center;justify-content:space-between;gap:10px}.settingsBtn{background:white;border:1px solid var(--border);border-radius:12px;padding:9px;color:var(--ink);font-weight:700}.sorting{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 10px}.sorting label{color:var(--sub);font-size:12px}.sorting select{display:block;border:1px solid var(--border);border-radius:9px;background:white;padding:9px 8px;color:var(--ink);font-size:13px}.backupBtn{border:1px solid var(--border);border-radius:12px;background:white;width:100%;text-align:left;margin:5px 0;padding:14px;font-weight:700;color:var(--ink)}.backupBtn.primary{background:var(--teal);color:white}.warn{color:#9c6219}.photoWarn{color:#b2602f}.minor{color:var(--sub);font-size:11px}.filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:12px 0}.pill{border:1px solid #ddd7d1;padding:7px 11px;border-radius:30px;background:white;color:#656b75;font-size:12px}.pill.active{background:var(--red);border-color:var(--red);color:white;font-weight:800}.pill.secondary.active{background:var(--teal);border-color:var(--teal)}.info{display:flex;justify-content:space-between;align-items:center;margin:8px 1px;color:var(--sub);font-size:12px}.link{border:none;background:none;color:var(--teal);font-weight:700;font-size:12px;padding:8px 4px;cursor:pointer}.group{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid #f0efeb;border-radius:16px;padding:9px 12px;margin-bottom:8px;min-height:88px;box-shadow:0 3px 10px #00000005;cursor:pointer}.group .name{font-weight:850;font-size:16px}.group .meta{font-size:12px;color:var(--sub);margin-top:5px}.thumb{width:76px;height:76px;flex:0 0 76px;border-radius:12px;background:#f3f6f8;object-fit:contain;display:block}.thumb.big{width:112px;height:112px;flex-basis:112px}.group .arrow{color:var(--sub);font-size:26px;margin-left:auto}.bar{display:flex;align-items:center;gap:12px;margin-bottom:12px}.bar h2{font-size:19px;margin:0}.count{font-size:13px;color:var(--sub);margin-bottom:12px}.record{background:#fff;border-radius:17px;border:1px solid #eeeae3;box-shadow:0 2px 15px #00000008;margin:0 0 11px;padding:13px}.product{display:flex;align-items:flex-start;gap:12px}.product .description{flex:1;min-width:0}.record h3{font-size:15px;margin:0 0 7px;line-height:1.5}.record .series{font-size:12px;color:#576479;line-height:1.4}.record .year{font-size:12px;color:#778398;margin-top:5px}.flag{font-size:11px;margin:7px 0 0;color:var(--teal);font-weight:700}.flag.ref{color:#997620}.explain{font-size:10px;color:#9b9daa;margin:6px 0 8px}.actions{display:flex;align-items:center;gap:7px;border-top:1px solid #eee;padding-top:10px}.owned{margin-right:auto;font-weight:750;color:var(--teal)}.owned.missing{color:var(--sub);font-weight:500}.smallBtn{border-radius:10px;border:1px solid #f0e1dc;background:#fff5f1;color:var(--red);min-width:40px;height:36px;font-size:23px;cursor:pointer}.smallBtn.add{background:var(--red);color:white;border-color:var(--red);min-width:86px;padding:0 10px;font-size:14px;font-weight:800}.smallBtn:disabled{opacity:.35}.footer{text-align:right;margin-top:5px}.empty{text-align:center;color:var(--sub);padding:30px 12px}.muted{color:var(--sub)}.legal{font-size:11px;line-height:1.5;color:#9a9aa0;background:#fffcf5;padding:11px;border-radius:12px;margin-bottom:13px}.upcoming{color:#a36c10!important}.tagline{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0}.typeTag{font-size:10px;color:#356d6a;background:#e9f6f2;padding:3px 6px;border-radius:6px}.hidden{display:none!important}

.officialGallery{margin:8px 0 12px;border:1px solid #d9e6e6;border-radius:10px;padding:9px;font-size:11px;color:#596b70;background:#f7faf9}.officialGallery img{display:block;max-width:100%;max-height:180px;object-fit:contain;margin:auto auto 6px}
</style></head><body>
<header><div class="headRow"><div><div class="logo">ポケピーノ <span style="font-size:19px">📒</span></div><div class="tag">手動で探して登録するコレクション図鑑</div></div><button class="settingsBtn" onclick="switchTab('settings')">⚙ 設定</button></div></header>
<main id="screen"><div class="empty">図鑑を読み込み中…</div></main>
<nav><button id="nav-dex" class="active" onclick="switchTab('dex')"><strong>▦</strong>図鑑</button><button id="nav-owned" onclick="switchTab('owned')"><strong>✓</strong>所持リスト</button></nav>
<script>
'use strict';
const N = window.Native || {getCatalog:()=> '[]',getOwned:()=> '{}',setOwned:()=>{},openOfficial:()=>{}};
let records=[], owned={}, view='dex', selected='', term='', filter='all', onlyOfficial=false, specialOnly=false, photosOnly=false, era='all', sortMode='dex', displayLimit=100, isComposing=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getCount=r=>Number(owned[r[0]]||0);
const normalizeQuery=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+96)).replace(/[\s\-‐ｰー]/g,'');
const isVariant=r=>/メガ|フォルム|フォーム|すがた|クリア|テラスタル|なみのり|お祝い|アーマード|キョダイ|ポーズ|色違い|色ちがい|特別|限定|シークレット|スペシャル/.test(r[3]+' '+r[4]);
const isOfficial=r=>r[6]==='official'||r[6]==='planned';
const groupKey=r=>r[1]>0?'n'+r[1]:'p'+r[2];
function pictureKind(r){return art(r)?'reference':'missing';}
function art(r){return r[9]==='needs_review'?'':(r[7]||'');}
function imageFailed(el){const d=document.createElement('div');d.className=el.className;d.textContent='実物写真未確認';d.style.display='grid';d.style.placeItems='center';el.replaceWith(d);}
function image(r,large=false){const u=art(r);return u?'<img class="thumb '+(large?'big':'')+'" loading="lazy" referrerpolicy="no-referrer" src="'+esc(u)+'" onerror="imageFailed(this)">':'<div class="thumb '+(large?'big':'')+'" style="display:grid;place-items:center;color:#aaa">実物写真未確認</div>';}
function recordVisible(r){return (!onlyOfficial||isOfficial(r))&&(!specialOnly||isVariant(r))&&(!photosOnly||!!art(r))&&(era==='all'||String(r[5]).startsWith(era.slice(0,3)))&&(filter==='all'||filter==='missing'&&getCount(r)===0||filter==='owned'&&getCount(r)>0);}
function countOwned(){return records.filter(r=>getCount(r)>0).length;}
function updateNav(){document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));const id=view==='owned'?'nav-owned':'nav-dex';if(view!=='settings')$('#'+id).classList.add('active');}
function switchTab(t){view=t;selected='';displayLimit=100;render();window.scrollTo(0,0);}
function onSearch(v){term=v;displayLimit=100;const results=$('#search-results');if(results){results.innerHTML=renderResultSection();}else{render();}}
function clearSearch(){term='';displayLimit=100;render();}
function searchInput(){return '<input id="query" aria-label="商品名で検索" class="search" type="search" autocomplete="off" placeholder="名前・フォルム・発売年で検索" value="'+esc(term)+'" oncompositionstart="isComposing=true" oncompositionend="isComposing=false;onSearch(this.value)" oninput="if(!isComposing)onSearch(this.value)">'+(term?'<button class="link" onclick="clearSearch()">検索をクリア ×</button>':'');}
function setFilter(v){filter=v;displayLimit=100;render();}
function toggleOfficial(){onlyOfficial=!onlyOfficial;render();}
function toggleSort(){sortMode=sortMode==='newest'?'oldest':'newest';render();}
function setSort(v){sortMode=v;displayLimit=100;render();}
function setEra(v){era=v;displayLimit=100;render();}
function toggleSpecial(){specialOnly=!specialOnly;displayLimit=100;render();}
function togglePhotos(){photosOnly=!photosOnly;displayLimit=100;render();}
function pokepinoBackupResult(ok,message){const el=$('#backup-status');if(el){el.textContent=message;el.style.color=ok?'#178e88':'#b04030';}}
function reloadOwnedFromAndroid(){owned=JSON.parse(N.getOwned());render();}
function requestBackup(){if(N.exportBackup)N.exportBackup();}
function requestRestore(){if(confirm('端末の所持数を残してバックアップを統合します。よろしいですか？')&&N.restoreBackup)N.restoreBackup();}
function showGroup(k){selected=k;render();window.scrollTo(0,0);}
function backToDex(){selected='';render();window.scrollTo(0,0);}
window.goBackFromAndroid=function(){if(selected){backToDex();return true;}if(view!=='dex'){switchTab('dex');return true;}return false;};
function changeCount(id,delta){const next=Math.max(0,Math.min(999,Number(owned[id]||0)+delta));owned[id]=next;N.setOwned(id,next);render();}
function referenceLink(u){if(u && u.startsWith('https://www.yubi-nin.jp/pokemon/'))N.openReference(u);}
function formWords(v){return /メガ|フォルム|フォーム|すがた|クリア|テラスタル|《|なみのり|お祝い|アーマード|キョダイ|ポーズ|色違い|郵便屋/.test(String(v));}
function officialLink(u){if(u&&u.indexOf('https://www.bandai.co.jp/candy/')===0)N.openOfficial(u);}
const button=(label,active,fn,extra='')=>'<button class="pill '+(active?'active ':'')+extra+'" onclick="'+fn+'">'+label+'</button>';
function filters(){return '<div class="filters">'+button('全部',filter==='all',"setFilter('all')")+button('未所持',filter==='missing',"setFilter('missing')")+button('所持',filter==='owned',"setFilter('owned')")+button('公式掲載',onlyOfficial,'toggleOfficial()','secondary')+button('形・色違い',specialOnly,'toggleSpecial()','secondary')+button('実物参考写真あり',photosOnly,'togglePhotos()','secondary')+'</div><div class="sorting"><label>年代<select aria-label="発売年代" onchange="setEra(this.value)">'+[['all','すべて'],['1990','1990年代'],['2000','2000年代'],['2010','2010年代'],['2020','2020年代']].map(([v,l])=>'<option value="'+v+'" '+(era===v?'selected':'')+'>'+l+'</option>').join('')+'</select></label><label>並び順<select aria-label="並び順" onchange="setSort(this.value)">'+[['dex','全国図鑑番号順'],['name','名前順'],['newest','発売が新しい順'],['oldest','発売が古い順'],['owned','所持数が多い順']].map(([v,l])=>'<option value="'+v+'" '+(sortMode===v?'selected':'')+'>'+l+'</option>').join('')+'</select></label></div>';}
function stats(){const oc=records.filter(isOfficial);return '<div class="stats"><div class="stat"><small>所持発売版</small><div class="num">'+countOwned()+'</div></div><div class="stat"><small>所持個数</small><div class="num">'+records.reduce((sum,r)=>sum+getCount(r),0)+'</div></div><div class="stat"><small>公式掲載登録</small><div class="num">'+oc.filter(r=>getCount(r)>0).length+'</div></div></div>';}
function searchMatch(r){const q=normalizeQuery(term.trim());return !q||normalizeQuery([r[1],r[2],r[3],r[4],r[5]].join(' ')).includes(q);}
function sorted(arr){return arr.slice().sort((a,b)=>{if(sortMode==='dex')return (a[1]||9999)-(b[1]||9999)||String(a[5]).localeCompare(String(b[5]));if(sortMode==='name')return String(a[2]).localeCompare(String(b[2]),'ja');if(sortMode==='owned')return getCount(b)-getCount(a)||String(a[2]).localeCompare(String(b[2]),'ja');return (sortMode==='oldest'?1:-1)*String(a[5]).localeCompare(String(b[5]))||String(a[2]).localeCompare(String(b[2]),'ja');});}
function groupRow(key,list){let r=list[0];const n=list.filter(x=>getCount(x)>0).length;const max=sorted(list)[0];const forms=list.filter(x=>formWords(x[3])).length;const future=list.filter(x=>x[6]==='planned').length;return '<div class="group" data-key="'+esc(key)+'" onclick="showGroup(this.dataset.key)">'+image(max)+'<div><div class="name">'+esc(r[2])+'</div><div class="meta">発売版 '+list.length+'件（形・色違い表記 '+forms+'件）</div><div class="meta">所持 '+n+'件'+(future?' / 発売予定 '+future+'件':'')+'</div><div class="meta">'+(r[1]>0?'全国図鑑 No.'+String(r[1]).padStart(3,'0'):'特別・関連商品')+'</div></div><div class="arrow">›</div></div>';}
function figureTags(r){const s=String(r[3]||'')+' '+String(r[4]||'');const tags=[];if(/復刻|再販/.test(s))tags.push('復刻・再販');if(/限定|配布|抽選|懸賞/.test(s))tags.push('限定');if(/クリア/.test(s))tags.push('クリア');if(/色ちがい|色違い/.test(s))tags.push('色違い');if(/メガ|フォルム|フォーム|すがた|キョダイ|ポーズ/.test(s))tags.push('姿・ポーズ違い');if(/シークレット|スペシャル/.test(s))tags.push('特別版');return tags;}
function productCard(r){
const n=getCount(r),status=r[6],u=r[8],kind=pictureKind(r);const types=figureTags(r).map(t=>'<span class="typeTag">'+esc(t)+'</span>').join('');
const note=r[9]==='needs_review'?'【写真要照合】ほかのポケモンとの画像重複・管理番号の相違が疑われるため画像を非表示にしています。':kind==='reference'?'資料の実物参考写真（同一造形かは未確認）':'商品ごとの実物写真はまだ確認できていません。';
const year=esc(r[5]||'発売年不明')+((r[5]||'').includes('–')?'（年代目安）':'');
const flag=status==='official'?'● 公式ラインナップ確認済':status==='planned'?'● 公式発表・発売予定':status==='legacy_unverified'?'△ 旧版の仮登録（発売商品として未確定）':'△ 歴代参考資料・個別商品確認待ち';
const links=(u&&u.startsWith('https://www.bandai.co.jp/candy/'))?'<div class="footer"><button class="link" data-url="'+esc(u)+'" onclick="officialLink(this.dataset.url)">発売元の商品ページを見る ↗</button></div>':(u&&u.startsWith('https://www.yubi-nin.jp/pokemon/'))?'<div class="footer"><button class="link" data-url="'+esc(u)+'" onclick="referenceLink(this.dataset.url)">参考図鑑を見る ↗</button></div>':'';
const officialGallery=(!art(r)&&r[10]&&r[10].startsWith('https://www.bandai.co.jp/candy/published/'))?'<div class="officialGallery"><img loading="lazy" src="'+esc(r[10])+'" alt="公式シリーズ画像（この商品単体の写真ではありません）" onerror="this.parentElement.style.display=\'none\'"><div>バンダイ公式のシリーズ画像・個別の指人形写真ではありません</div></div>':'';
return '<article class="record"><div class="product">'+image(r,true)+'<div class="description"><h3>'+esc(r[3]||r[2])+'</h3><div class="series">'+esc(r[4])+'</div><div class="year">'+year+'</div><div class="tagline">'+types+'</div><div class="flag '+(status==='reference'?'ref':'')+' '+(status==='planned'?'upcoming':'')+'">'+flag+'</div></div></div><p class="explain">'+esc(note)+'</p>'+officialGallery+'<div class="actions"><span class="owned '+(n?'':'missing')+'">'+(n?'✓ 所持 ×'+n:'○ 未所持')+'</span><button class="smallBtn" '+(n?'':'disabled')+' data-id="'+esc(r[0])+'" onclick="changeCount(this.dataset.id,-1)">−</button><button class="smallBtn add" data-id="'+esc(r[0])+'" onclick="changeCount(this.dataset.id,1)">'+(n?'＋ 1個':'持っている ＋')+'</button></div>'+links+'</article>';
}
function renderResultSection(){
if(view==='owned'&&!selected){
 const arr=sorted(records.filter(r=>getCount(r)>0&&searchMatch(r)));
 const total=records.filter(r=>getCount(r)>0).length;
 return '<p class="count">'+arr.length+' / '+total+' 発売版を表示・個数も変更できます</p>'
 +arr.slice(0,displayLimit).map(productCard).join('')
 +(arr.length>displayLimit?'<button class="pill" onclick="more()">さらに表示 ＋</button>':'')
 +(arr.length===0?'<div class="empty">'+(total===0?'所持登録はまだありません。図鑑から登録してください。':'検索条件に合う所持商品がありません。')+'</div>':'');
}
if(selected){
 const list=sorted(records.filter(r=>groupKey(r)===selected));
 const visible=list.filter(r=>recordVisible(r)&&searchMatch(r));
 return '<div class="count">条件に一致 '+visible.length+' 件 / 全 '+list.length+' 件</div>'
 +visible.slice(0,displayLimit).map(productCard).join('')
 +(visible.length>displayLimit?'<button class="pill" onclick="more()">さらに表示 ＋</button>':'')
 +(visible.length===0?'<div class="empty">条件に合う発売版がありません。検索条件を解除してみてね。</div>':'');
}
const matched=records.filter(r=>recordVisible(r)&&searchMatch(r));
const group=new Map();
for(const r of matched){const k=groupKey(r);if(!group.has(k))group.set(k,[]);group.get(k).push(r);}
const gs=Array.from(group.entries()).sort((a,b)=>{
 const x=sorted(a[1])[0],y=sorted(b[1])[0];
 if(sortMode==='dex')return (x[1]||9999)-(y[1]||9999)||String(x[2]).localeCompare(String(y[2]),'ja');
 if(sortMode==='name')return String(x[2]).localeCompare(String(y[2]),'ja');
 if(sortMode==='owned')return b[1].filter(r=>getCount(r)>0).length-a[1].filter(r=>getCount(r)>0).length;
 return (sortMode==='oldest'?1:-1)*String(x[5]).localeCompare(String(y[5]))||String(x[2]).localeCompare(String(y[2]),'ja');
});
return '<div class="info"><span>'+records.length+' 件収録（参考を含む）・ '+gs.length+' 匹表示対象</span><span class="minor">名前・発売年・形違いで検索</span></div>'
 +'<div class="legal">造形の同一性を確認できていない復刻版は別の発売記録として表示しています。実物参考写真は全件確認済みではありません。</div>'
 +gs.slice(0,displayLimit).map(([k,list])=>groupRow(k,list)).join('')
 +(gs.length>displayLimit?'<button class="pill" onclick="more()">さらに表示 ＋</button>':'')
 +(gs.length===0?'<div class="empty">該当するポケモンがありません。条件を変更してください。</div>':'');
}
function render(){
 updateNav();
 const el=$('#screen');
 if(view==='settings'){
  el.innerHTML='<h2>設定・データ管理</h2><div class="record"><h3>所持データのバックアップ・復元</h3><p class="minor">所持商品と個数をJSONファイルで書き出し・復元します。撮影やユーザー登録は不要です。</p><button class="backupBtn primary" onclick="requestBackup()">所持データを書き出す</button><button class="backupBtn" onclick="requestRestore()">JSONから復元する</button><p class="minor warn">復元しても今の登録は消去しません。同じ商品の個数は大きい方を残します。</p><p id="backup-status" aria-live="polite"></p></div><div class="record"><h3>使い方と収録範囲</h3>名前や図鑑番号で探し、対象の発売版の「持っている ＋」を押してください。発売版は2026年10月1日以前を対象に収録していますが、全種類の照合は完了していません。<p class="minor">同一造形・復刻の完全照合や個別写真の確認は継続課題です。ログイン・カメラ・写真投稿はありません。</p></div>';
  return;
 }
 if(view==='about'){view='settings';render();return;}
 const heading=view==='owned'?'<h2>所持リスト</h2>':selected?'<div class="bar"><button class="pill" onclick="backToDex()">← 戻る</button><h2>'+esc(records.find(r=>groupKey(r)===selected)?.[2]||'商品詳細')+'</h2></div>':stats();
 el.innerHTML=heading+searchInput()+(view==='owned'?'':filters())+'<div id="search-results">'+renderResultSection()+'</div>';
}
function more(){displayLimit+=100;render();}
function boot(){try{records=JSON.parse(N.getCatalog());owned=JSON.parse(N.getOwned());render();}catch(e){$('#screen').textContent='図鑑の読み込みに失敗しました: '+e.message;}}
boot();
</script></body></html>
