<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a1020">
<title>GLYPH SPIN ARENA</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#263765 0,#0a1020 43%,#060912 100%);color:#f4f7ff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,system-ui,sans-serif}body{padding:max(12px,env(safe-area-inset-top)) 10px max(18px,env(safe-area-inset-bottom));overscroll-behavior:none}.wrap{max-width:1120px;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:3px 3px 13px}.logo{font-size:clamp(24px,5vw,42px);font-weight:950;letter-spacing:.05em;line-height:1}.logo small{display:block;font-size:.28em;color:#74efff;letter-spacing:.18em;margin-bottom:7px}.desc{max-width:470px;color:#9caed5;font-size:12px;line-height:1.55}.grid{display:grid;grid-template-columns:minmax(300px,355px) 1fr;gap:12px}.card{background:linear-gradient(180deg,rgba(24,34,62,.98),rgba(13,20,38,.98));border:1px solid rgba(255,255,255,.08);border-radius:20px;box-shadow:0 20px 45px rgba(0,0,0,.28)}.controls{padding:14px}.arena{padding:11px;min-height:610px}.box{padding:12px;border-radius:15px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);margin-bottom:9px}.lab{font-size:11px;color:#9caed5;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}.row{display:flex;align-items:center;gap:10px}.inp{width:74px;height:74px;border:1px solid rgba(116,239,255,.4);border-radius:17px;background:#080d1b;color:white;text-align:center;font-size:41px;font-weight:900;outline:none}.inp:focus{border-color:#74efff;box-shadow:0 0 0 3px rgba(116,239,255,.12)}.stats{flex:1}.name{font-size:11px;color:#9caed5}.m{display:grid;grid-template-columns:62px 1fr 28px;gap:7px;align-items:center;margin:6px 0;font-size:11px}.bar{height:8px;border-radius:99px;background:#08101f;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#74efff,#91a7ff)}.power{background:linear-gradient(90deg,#ff8be2,#ff896f)}.balance{background:linear-gradient(90deg,#82f2ae,#dcff78)}.mini{font-size:9px;color:#9caed5;line-height:1.5;margin-top:5px}.vs{text-align:center;font-weight:900;opacity:.45;font-size:11px;margin:0 0 7px}.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:14px;min-height:48px;padding:11px 8px;font-weight:900;cursor:pointer;touch-action:manipulation;color:#07101e;background:linear-gradient(180deg,#9cf8ff,#69d3f4)}.btn:active{transform:scale(.98)}.pink{background:linear-gradient(180deg,#ffc1f3,#d88aff)}.ghost{color:#eef3ff;background:#0b1326;border:1px solid rgba(255,255,255,.09)}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 3px 9px;color:#9caed5;font-size:11px}.top strong{color:white}.pill{padding:5px 8px;border-radius:99px;background:#0a1225;border:1px solid rgba(255,255,255,.08)}canvas{display:block;width:100%;height:auto;aspect-ratio:16/10;border-radius:17px;border:1px solid rgba(255,255,255,.08);background:#0b1020}.log{height:120px;overflow:auto;margin-top:9px;padding:9px 10px;background:#08101f;border:1px solid rgba(255,255,255,.06);border-radius:13px;color:#cbd5ef;font-size:11px;line-height:1.55}.log b{color:white}.err{display:none;margin-top:8px;padding:8px 9px;border-radius:11px;background:rgba(255,80,100,.12);border:1px solid rgba(255,112,133,.35);color:#ffd8df;font-size:10px}.foot{text-align:center;color:#7182aa;font-size:9px;margin-top:9px}@media(max-width:830px){.grid{grid-template-columns:1fr}.arena{order:1;min-height:auto}.controls{order:2}.head{align-items:start;flex-direction:column}.desc{display:none}.log{height:95px}}
</style>
</head>
<body>
<div class="wrap">
<div class="head"><div class="logo"><small>ONE-CHARACTER PHYSICS BATTLE</small>GLYPH SPIN ARENA</div><div class="desc">一文字の形を解析してSPEED / POWER / BALANCEを生成し、リング上で物理バトル。</div></div>
<div class="grid">
<section class="card controls">
<div class="box"><div class="lab">PLAYER 1</div><div class="row"><input id="c1" class="inp" value="炎" inputmode="text" autocomplete="off"><div id="s1" class="stats"></div></div></div>
<div class="vs">VS</div>
<div class="box"><div class="lab">PLAYER 2</div><div class="row"><input id="c2" class="inp" value="水" inputmode="text" autocomplete="off"><div id="s2" class="stats"></div></div></div>
<div class="box"><div class="lab">BATTLE</div><div class="btns"><button type="button" id="fight" class="btn">BATTLE START</button><button type="button" id="random" class="btn pink">RANDOM</button><button type="button" id="rematch" class="btn ghost">REMATCH</button><button type="button" id="pause" class="btn ghost">PAUSE</button></div><div class="mini" style="margin-top:9px">形状面積・重心・慣性・対称性・外周率・摩擦・衝突・リングアウトを計算。</div></div>
<div id="err" class="err"></div>
</section>
<section class="card arena"><div class="top"><div id="status"><strong>READY</strong> — 文字を選んで開始</div><div id="fps" class="pill">-- FPS</div></div><canvas id="game" width="1000" height="625"></canvas><div id="log" class="log"></div></section>
</div><div class="foot">オリジナルの文字コマ物理ゲーム</div>
</div>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)},cv=$('#game'),ctx=cv.getContext('2d'),W=1000,H=625,CX=500,CY=312.5,RING=260;
var status=$('#status'),log=$('#log'),fps=$('#fps'),err=$('#err'),fighters=[],running=false,paused=false,winner=null,match=0,last=performance.now(),acc=0,frames=0,fpsT=performance.now(),comp={c1:false,c2:false};
var chars=Array.from('炎水風雷光闇龍虎剣盾星月空海山川王神鬼力心速金銀火木土愛夢勝零天地翔烈轟鋼氷翼牙忍侍魔聖極技運一二三四五六七八九ABCDEFGHIJKLMNOPQRSTUVWXYZ!?★◆●▲');
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function one(v){v=String(v||'').trim();if(!v)return '無';try{if(Intl&&Intl.Segmenter){var it=new Intl.Segmenter('ja',{granularity:'grapheme'}).segment(v)[Symbol.iterator](),n=it.next();return n.done?'無':n.value.segment}}catch(e){}return Array.from(v)[0]||'無'}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fallback(ch){var x=Array.from(ch).reduce(function(a,b){return a+b.codePointAt(0)},0)||1;return{speed:40+x%50,power:40+(x*7)%50,balance:40+(x*13)%50,mass:1,sym:.5,rough:.5,compact:.5}}
function analyze(ch){var c=document.createElement('canvas');c.width=c.height=220;var g=c.getContext('2d');g.clearRect(0,0,220,220);g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.font='900 165px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif';g.fillText(ch,110,114);var d;try{d=g.getImageData(0,0,220,220).data}catch(e){return fallback(ch)}var p=[],minX=219,minY=219,maxX=0,maxY=0,x,y,a;for(y=0;y<220;y+=2)for(x=0;x<220;x+=2){a=d[(y*220+x)*4+3];if(a>30){p.push([x,y,a/255]);minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y)}}if(!p.length)return fallback(ch);var m=0,sx=0,sy=0;p.forEach(function(q){m+=q[2];sx+=q[0]*q[2];sy+=q[1]*q[2]});var gx=sx/m,gy=sy/m,I=0;p.forEach(function(q){I+=((q[0]-gx)*(q[0]-gx)+(q[1]-gy)*(q[1]-gy))*q[2]});I/=m;var bw=Math.max(1,maxX-minX),bh=Math.max(1,maxY-minY),density=clamp(m*4/(bw*bh),0,1);function A(xx,yy){xx=Math.round(xx);yy=Math.round(yy);if(xx<0||xx>219||yy<0||yy>219)return 0;return d[(yy*220+xx)*4+3]/255}var diff=0,n=0;for(y=minY;y<=maxY;y+=5)for(x=minX;x<=maxX;x+=5){diff+=Math.abs(A(x,y)-A(2*gx-x,y))+Math.abs(A(x,y)-A(x,2*gy-y));n+=2}var sym=1-clamp(diff/Math.max(1,n),0,1),edge=0,filled=0;for(y=3;y<217;y+=3)for(x=3;x<217;x+=3)if(A(x,y)>.2){filled++;if(A(x+3,y)<.2||A(x-3,y)<.2||A(x,y+3)<.2||A(x,y-3)<.2)edge++}var rough=clamp(edge/Math.max(1,filled)*2.05,0,1),spread=clamp(Math.sqrt(I)/82,0,1),off=clamp(Math.hypot(gx-110,gy-110)/58,0,1),compact=clamp(density*1.15,0,1),mass=clamp(.72+compact*.48+spread*.36,.75,1.65),seed=Array.from(ch).reduce(function(s,z){return s+z.codePointAt(0)},0),spice=((seed*9301+49297)%233280)/233280-.5;return{speed:Math.round(clamp(88-compact*22-spread*13+sym*9-rough*7-spice*3,20,99)),power:Math.round(clamp(38+compact*28+rough*19+spread*14+spice*6,20,99)),balance:Math.round(clamp(72+sym*24-off*38-rough*10+spice*2,20,99)),mass:mass,sym:sym,rough:rough,compact:compact}}
function sh(ch,s){function r(n,v,c){return '<div class="m"><b>'+n+'</b><div class="bar"><div class="fill '+c+'" style="width:'+v+'%"></div></div><strong>'+v+'</strong></div>'}return '<div class="name">「'+esc(ch)+'」の形状解析</div>'+r('SPEED',s.speed,'')+r('POWER',s.power,'power')+r('BALANCE',s.balance,'balance')+'<div class="mini">重さ '+s.mass.toFixed(2)+' / 対称性 '+Math.round(s.sym*100)+'% / 外周 '+Math.round(s.rough*100)+'%</div>'}
function read(commit){var a=one($('#c1').value),b=one($('#c2').value);if(commit){$('#c1').value=a;$('#c2').value=b}return[a,b]}
function refresh(commit){var a=read(commit);$('#s1').innerHTML=sh(a[0],analyze(a[0]));$('#s2').innerHTML=sh(a[1],analyze(a[1]))}
function add(t){var d=document.createElement('div');d.innerHTML=t;log.insertBefore(d,log.firstChild)}
function Fighter(ch,i){this.ch=ch;this.i=i;this.st=analyze(ch);this.r=41+this.st.compact*9;this.mass=this.st.mass;this.x=CX+(i?118:-118);this.y=CY+(i?26:-26);this.angle=Math.random()*Math.PI*2;var launch=90+this.st.speed*.88,dir=i?Math.PI:0,tilt=(Math.random()-.5)*.48;this.vx=Math.cos(dir+tilt)*launch;this.vy=Math.sin(dir+tilt)*launch;this.spin=(i?-1:1)*(11.5+this.st.speed*.092);this.energy=100;this.alive=true;this.flash=0;this.cd=0;this.color=i?'#ff8be2':'#74efff';this.trail=[]}
function start(){var a=read(true);refresh(false);match++;winner=null;paused=false;$('#pause').textContent='PAUSE';fighters=[new Fighter(a[0],0),new Fighter(a[1],1)];running=true;acc=0;status.innerHTML='<strong>BATTLE '+match+'</strong> — '+esc(a[0])+' vs '+esc(a[1]);add('<b>Battle '+match+'</b>：「'+esc(a[0])+'」 vs 「'+esc(a[1])+'」 開始！')}
function randomize(){var a=chars[(Math.random()*chars.length)|0],b=a,n=0;while(b===a&&n++<10)b=chars[(Math.random()*chars.length)|0];$('#c1').value=a;$('#c2').value=b;refresh(false);status.innerHTML='<strong>RANDOM</strong> — 「'+esc(a)+'」 vs 「'+esc(b)+'」';add('🎲 ランダム：「'+esc(a)+'」 vs 「'+esc(b)+'」')}
function hit(a,b){var dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy),min=a.r+b.r;if(!a.alive||!b.alive||dist<=0||dist>=min)return;var nx=dx/dist,ny=dy/dist,over=min-dist,sum=a.mass+b.mass;a.x-=nx*over*b.mass/sum;a.y-=ny*over*b.mass/sum;b.x+=nx*over*a.mass/sum;b.y+=ny*over*a.mass/sum;var rvx=b.vx-a.vx,rvy=b.vy-a.vy,vel=rvx*nx+rvy*ny;if(vel>0)return;var j=-(1+.84)*vel/(1/a.mass+1/b.mass),aa=(a.st.power/100)*(Math.abs(a.spin)/18)*(.8+a.st.rough*.5),bb=(b.st.power/100)*(Math.abs(b.spin)/18)*(.8+b.st.rough*.5);j*=1+(aa+bb)*.22;var ix=j*nx,iy=j*ny;a.vx-=ix/a.mass;a.vy-=iy/a.mass;b.vx+=ix/b.mass;b.vy+=iy/b.mass;var ti=(a.spin-b.spin)*.38;a.vx+=-ny*ti/a.mass;a.vy+=nx*ti/a.mass;b.vx+=ny*ti/b.mass;b.vy+=-nx*ti/b.mass;var loss=Math.min(7,Math.abs(j)*.0045);a.energy-=loss*(1.1-a.st.balance/160);b.energy-=loss*(1.1-b.st.balance/160);a.spin*=.985;b.spin*=.985;a.flash=b.flash=1;if(a.cd<=0&&b.cd<=0){add('💥 「'+esc(a.ch)+'」と「'+esc(b.ch)+'」が激突！');a.cd=b.cd=.18}}
function step(dt){if(!running||paused||winner||fighters.length<2)return;fighters.forEach(function(f){if(!f.alive)return;f.cd=Math.max(0,f.cd-dt);f.flash=Math.max(0,f.flash-dt*6);var sp=Math.hypot(f.vx,f.vy),drag=.25-f.st.balance/100*.11;f.vx*=Math.exp(-drag*dt);f.vy*=Math.exp(-drag*dt);f.spin*=Math.exp(-(.17+(1-f.st.balance/100)*.18+f.st.rough*.05)*dt);f.energy-=dt*(1.55+(1-f.st.balance/100)*1.3+sp*.0016);var wob=Math.max(0,1-Math.abs(f.spin)/8);f.vx+=Math.cos(f.angle*1.7)*wob*7*dt;f.vy+=Math.sin(f.angle*1.4)*wob*7*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.angle+=f.spin*dt;f.trail.push([f.x,f.y]);if(f.trail.length>16)f.trail.shift();var rr=Math.hypot(f.x-CX,f.y-CY);if(rr>RING-f.r*.18){var nx=(f.x-CX)/rr,ny=(f.y-CY)/rr,rad=f.vx*nx+f.vy*ny;if(rad>0){f.vx-=1.65*rad*nx;f.vy-=1.65*rad*ny;f.energy-=Math.abs(rad)*.012;f.spin*=.992}if(rr>RING+f.r*.52){f.alive=false;add('💨 「'+esc(f.ch)+'」リングアウト！')}}if(f.energy<=0||Math.abs(f.spin)<1.15){if(f.alive)add('🌀 「'+esc(f.ch)+'」スピン停止！');f.alive=false}});hit(fighters[0],fighters[1]);var alive=fighters.filter(function(f){return f.alive});if(alive.length<2){running=false;if(alive.length===1){winner=alive[0];status.innerHTML='<strong>WINNER：「'+esc(winner.ch)+'」</strong>';add('🏆 <b>「'+esc(winner.ch)+'」 WIN!</b>')}else{status.innerHTML='<strong>DRAW</strong>';add('⚖️ ドロー！')}}}
function arena(){ctx.clearRect(0,0,W,H);var g=ctx.createRadialGradient(CX,CY,30,CX,CY,RING+100);g.addColorStop(0,'#2b3c69');g.addColorStop(.7,'#11192e');g.addColorStop(1,'#050912');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(CX,CY);ctx.beginPath();ctx.arc(0,0,RING,0,Math.PI*2);ctx.fillStyle='#17223f';ctx.fill();ctx.lineWidth=16;ctx.strokeStyle='#3c4f80';ctx.stroke();ctx.beginPath();ctx.arc(0,0,RING-24,0,Math.PI*2);ctx.lineWidth=3;ctx.strokeStyle='rgba(116,239,255,.18)';ctx.stroke();for(var r=70;r<240;r+=55){ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,.035)';ctx.lineWidth=1;ctx.stroke()}ctx.restore();if(!fighters.length){ctx.fillStyle='rgba(255,255,255,.42)';ctx.textAlign='center';ctx.font='800 20px system-ui';ctx.fillText('BATTLE START',CX,CY+8)}}
function drawF(f){if(f.trail.length>1){ctx.beginPath();f.trail.forEach(function(p,i){i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])});ctx.strokeStyle=f.i?'rgba(255,139,226,.18)':'rgba(116,239,255,.18)';ctx.lineWidth=5;ctx.stroke()}ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.angle);var g=ctx.createRadialGradient(-12,-14,4,0,0,f.r+9);g.addColorStop(0,'#fff');g.addColorStop(.16,f.color);g.addColorStop(.72,'#273554');g.addColorStop(1,'#070c18');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,f.r,0,Math.PI*2);ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=f.flash>0?'#fff':f.color;ctx.stroke();var fins=3+Math.round(f.st.rough*5);ctx.fillStyle=f.color;for(var i=0;i<fins;i++){ctx.rotate(Math.PI*2/fins);ctx.beginPath();ctx.moveTo(f.r-6,-7);ctx.lineTo(f.r+7,0);ctx.lineTo(f.r-6,7);ctx.closePath();ctx.fill()}ctx.rotate(-f.angle);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 42px -apple-system,"Hiragino Sans","Yu Gothic",sans-serif';ctx.fillText(f.ch,0,2);ctx.restore();var bx=f.i?W-250:26,hx=f.i?W-238:38;ctx.fillStyle='rgba(6,10,20,.8)';ctx.fillRect(bx,24,224,78);ctx.fillStyle=f.color;ctx.textAlign='left';ctx.font='900 20px system-ui';ctx.fillText('「'+f.ch+'」',hx,48);ctx.fillStyle='#cbd6f2';ctx.font='12px system-ui';ctx.fillText('ENERGY '+Math.max(0,f.energy).toFixed(0)+'   RPM '+Math.max(0,Math.abs(f.spin)*520|0),hx,69);ctx.fillStyle='#101830';ctx.fillRect(hx,80,190,8);ctx.fillStyle=f.color;ctx.fillRect(hx,80,190*clamp(f.energy/100,0,1),8)}
function draw(){arena();fighters.forEach(drawF)}
function loop(t){try{var dt=Math.min(.033,Math.max(0,(t-last)/1000));last=t;frames++;if(t-fpsT>600){fps.textContent=Math.round(frames*1000/(t-fpsT))+' FPS';frames=0;fpsT=t}if(!paused){acc+=dt;var fixed=1/120,guard=0;while(acc>=fixed&&guard++<8){step(fixed);acc-=fixed}}draw();requestAnimationFrame(loop)}catch(e){err.style.display='block';err.textContent='エラー: '+e.message}}
function bind(id){var el=$('#'+id);el.addEventListener('compositionstart',function(){comp[id]=true});el.addEventListener('compositionend',function(){comp[id]=false;el.value=one(el.value);refresh(false)});el.addEventListener('input',function(){if(!comp[id])refresh(false)});el.addEventListener('blur',function(){el.value=one(el.value);refresh(false)})}
bind('c1');bind('c2');$('#fight').addEventListener('click',start);$('#rematch').addEventListener('click',start);$('#random').addEventListener('click',randomize);$('#pause').addEventListener('click',function(){paused=!paused;this.textContent=paused?'RESUME':'PAUSE';if(paused)status.innerHTML='<strong>PAUSED</strong>'});
window.addEventListener('error',function(e){err.style.display='block';err.textContent='エラー: '+(e.message||'不明なエラー')});
refresh(true);add('文字を2つ選んで <b>BATTLE START</b>。RANDOMも使えます。');draw();requestAnimationFrame(loop);
})();
</script>
</body></html>
