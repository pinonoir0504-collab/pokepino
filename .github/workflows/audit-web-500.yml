name: Audit 500 External Figure Images

on:
  push:
    branches: [ "audit/web-500-recognition" ]
    paths:
      - "tools/audit_web_500.py"
      - ".github/workflows/audit-web-500.yml"
      - "app/src/main/java/com/pokepino/app/VariantRecognizer.kt"
      - "app/src/main/assets/catalog_v2.json"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow numpy onnxruntime
      - name: Run independent 500-image audit
        run: python tools/audit_web_500.py --target 500 --pages 18
      - uses: actions/upload-artifact@v4
        with:
          name: pokepino-web500-audit
          path: |
            web500_audit.json
            web500_failures.csv
          if-no-files-found: error
