name: Audit 500 Mercari Rakuma Figures

on:
  push:
    branches: [ "audit/web-500-recognition" ]
    paths:
      - "tools/audit_marketplace_500.py"
      - "audit/marketplace_500_candidates.json"
      - ".github/workflows/audit-web-500.yml"
      - "app/src/main/java/com/pokepino/app/VariantRecognizer.kt"
      - "app/src/main/assets/catalog_v2.json"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow numpy onnxruntime
      - name: Run Mercari/Rakuma 500-image audit
        run: python tools/audit_marketplace_500.py
      - uses: actions/upload-artifact@v4
        with:
          name: pokepino-marketplace500-audit
          path: |
            marketplace500_audit.json
            marketplace500_failures.csv
            marketplace500_selection.json
          if-no-files-found: error
