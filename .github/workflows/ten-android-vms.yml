name: Pokepino 10 Independent Android VMs

on:
  workflow_dispatch:
  push:
    branches:
      - feat/collection-catalog-20261013
    paths:
      - "app/src/main/assets/collection.html"
      - "app/src/main/java/com/pokepino/app/CollectionActivity.kt"
      - "app/src/androidTest/java/com/pokepino/app/CollectionTenMachineTest.kt"
      - ".github/workflows/ten-android-vms.yml"

permissions:
  contents: read

jobs:
  independent-android-emulator:
    name: "Android VM ${{ matrix.worker }} / ${{ matrix.scenario }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - worker: 1
            scenario: t01_catalogLaunchAndManualNavigation
          - worker: 2
            scenario: t02_nameKanaAndNumberSearch
          - worker: 3
            scenario: t03_japaneseInputKeepsDomFieldAndFiltersResults
          - worker: 4
            scenario: t04_cutoffAndVariantSourceSeparation
          - worker: 5
            scenario: t05_missingOwnedFiltersAndManualAddRemove
          - worker: 6
            scenario: t06_repeatedCopiesAndUpperBound
          - worker: 7
            scenario: t07_sortEraAndVariantFilter
          - worker: 8
            scenario: t08_photoIntegrityAndBadReferenceWarning
          - worker: 9
            scenario: t09_backupExportRestoreValidRoundTrip
          - worker: 10
            scenario: t10_backupRejectsTamperingAndNeverLowersOwned
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Allow KVM virtualization on VM ${{ matrix.worker }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Run the assigned scenario on an independent Android virtual device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=com.pokepino.app.CollectionTenMachineTest#${{ matrix.scenario }}' --stacktrace
      - name: Upload independent test logs from this VM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokepino-vm-${{ matrix.worker }}-android-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn

  all-ten-verified:
    needs: independent-android-emulator
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm each virtual device passed
        env:
          VM_RESULT: ${{ needs.independent-android-emulator.result }}
        run: |
          echo "Ten independently scheduled Android emulators: $VM_RESULT"
          test "$VM_RESULT" = "success"
