name: Build PinoWatch v1.16.0

on:
  push:
    branches: [ "pinowatch-build-v116" ]
    paths:
      - ".github/workflows/build-pinowatch-v116.yml"
      - "pinowatch-build/v116-payload/**"
      - "pinowatch-build/v116-overlay/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          cat pinowatch-build/v116-payload/part_*.txt > /tmp/pinowatch-v116.b64
          test "$(wc -c < /tmp/pinowatch-v116.b64)" -eq 85952
          base64 -d /tmp/pinowatch-v116.b64 > /tmp/PinoWatch_v1.16.0_source.zip
          echo "bdf9133f17a9281797b5b02bd2902eaf7998f90fa60539c71bd562946f9053d4  /tmp/PinoWatch_v1.16.0_source.zip" | sha256sum -c -
          unzip -t /tmp/PinoWatch_v1.16.0_source.zip
          mkdir -p /tmp/pinowatch
          unzip -q /tmp/PinoWatch_v1.16.0_source.zip -d /tmp/pinowatch
          cp pinowatch-build/v116-overlay/DisclosureCatchUpWorker.java /tmp/pinowatch/app/src/main/java/com/tdwatch/stockwatchv4/DisclosureCatchUpWorker.java

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Static feature checks
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/pinowatch
          node --check app/src/main/assets/app.js
          python3 -c 'import json,xml.etree.ElementTree as ET; json.load(open("app/google-services.json",encoding="utf-8")); ET.parse("app/src/main/AndroidManifest.xml"); print("JSON/XML: PASS")'
          grep -q 'versionCode = 16' app/build.gradle.kts
          grep -q 'versionName = "1.16.0"' app/build.gradle.kts
          grep -q 'androidx.work:work-runtime:2.10.0' app/build.gradle.kts
          grep -q 'DisclosureCatchUpWorker' app/src/main/java/com/tdwatch/stockwatchv4/NotificationReliability.java
          grep -q 'favoritesOnly && !favorites.isEmpty()' app/src/main/java/com/tdwatch/stockwatchv4/DisclosureCatchUpWorker.java
          grep -q 'i += 25' app/src/main/java/com/tdwatch/stockwatchv4/DisclosureCatchUpWorker.java
          grep -q 'onDeletedMessages' app/src/main/java/com/tdwatch/stockwatchv4/PinoFirebaseService.java
          grep -q 'setExactAndAllowWhileIdle' app/src/main/java/com/tdwatch/stockwatchv4/EarningsReminderReceiver.java
          grep -q '20, 10' app/src/main/java/com/tdwatch/stockwatchv4/EarningsReminderReceiver.java
          grep -q 'last_notify_hash' app/src/main/java/com/tdwatch/stockwatchv4/EarningsReminderReceiver.java
          grep -q 'getNotificationDiagnostics' app/src/main/java/com/tdwatch/stockwatchv4/MainActivity.java
          grep -q 'requestExactAlarmAccess' app/src/main/java/com/tdwatch/stockwatchv4/MainActivity.java
          grep -q 'timeConfidence' app/src/main/java/com/tdwatch/stockwatchv4/EarningsScheduleService.java
          grep -q 'JPXページ解析失敗' app/src/main/java/com/tdwatch/stockwatchv4/EarningsScheduleService.java
          grep -q 'hasNewFavorite' app/src/main/java/com/tdwatch/stockwatchv4/EarningsScheduleService.java
          ! grep -q 'USE_EXACT_ALARM' app/src/main/AndroidManifest.xml
          echo "PinoWatch v1.16 feature checks: PASS"

      - name: Assemble debug APK
        working-directory: /tmp/pinowatch
        run: gradle :app:assembleDebug --stacktrace

      - name: Android lint
        working-directory: /tmp/pinowatch
        run: gradle :app:lintDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/pinowatch/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.tdwatch.stockwatchv4'" /tmp/apk-badging.txt
          grep -q "versionCode='16'" /tmp/apk-badging.txt
          grep -q "versionName='1.16.0'" /tmp/apk-badging.txt
          sha256sum "$APK" | tee /tmp/apk-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PinoWatch-v1.16.0-debug-apk
          path: /tmp/pinowatch/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
