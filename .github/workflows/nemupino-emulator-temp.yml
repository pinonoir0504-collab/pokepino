name: NemuPino emulator verification

on:
  push:
    branches:
      - nemupino-build-temp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Unpack NemuPino
        shell: bash
        run: |
          rm -rf nemupino-ci
          mkdir nemupino-ci
          unzip -q .nemupino-build/source.zip -d nemupino-ci
          cp .nemupino-build/SoundCandidates.kt nemupino-ci/app/src/main/java/com/oyasumi/recorder/SoundCandidates.kt
      - name: Emulator integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -camera-back none -camera-front none
          script: |
            cd nemupino-ci
            gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant com.oyasumi.recorder android.permission.RECORD_AUDIO || true
            adb shell pm grant com.oyasumi.recorder android.permission.POST_NOTIFICATIONS || true
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            set +e
            timeout 900 adb shell am instrument -w -r com.oyasumi.recorder.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/instrumentation.txt
            TEST_RC=${PIPESTATUS[0]}
            adb logcat -d > /tmp/logcat.txt || true
            adb shell dumpsys activity activities > /tmp/activity.txt || true
            adb shell dumpsys meminfo com.oyasumi.recorder > /tmp/meminfo.txt || true
            run-as com.oyasumi.recorder sh -c 'cat cache/actual-result.png' > /tmp/actual-result.png 2>/dev/null || true
            run-as com.oyasumi.recorder sh -c 'cat cache/design-overview.png' > /tmp/design-overview.png 2>/dev/null || true
            run-as com.oyasumi.recorder sh -c 'cat cache/design-ranking.png' > /tmp/design-ranking.png 2>/dev/null || true
            set -e
            test "$TEST_RC" -eq 0
            grep -q "OK (" /tmp/instrumentation.txt
      - name: Collect emulator diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p emulator-artifact
          cp /tmp/instrumentation.txt emulator-artifact/instrumentation.txt || true
          cp /tmp/logcat.txt emulator-artifact/logcat.txt || true
          cp /tmp/activity.txt emulator-artifact/activity.txt || true
          cp /tmp/meminfo.txt emulator-artifact/meminfo.txt || true
          for image in /tmp/actual-result.png /tmp/design-overview.png /tmp/design-ranking.png; do
            if [ -s "$image" ]; then cp "$image" emulator-artifact/; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nemupino-3.6.3-emulator
          path: emulator-artifact/
          if-no-files-found: warn
