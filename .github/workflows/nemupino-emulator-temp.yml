name: NemuPino emulator verification

on:
  push:
    branches:
      - nemupino-build-temp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Unpack NemuPino
        shell: bash
        run: |
          rm -rf nemupino-ci emulator-artifact
          mkdir nemupino-ci emulator-artifact
          unzip -q .nemupino-build/source.zip -d nemupino-ci
          cp .nemupino-build/SoundCandidates.kt nemupino-ci/app/src/main/java/com/oyasumi/recorder/SoundCandidates.kt
      - name: Emulator integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -camera-back none -camera-front none
          script: |
            set -o pipefail
            cd nemupino-ci
            gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant com.oyasumi.recorder android.permission.RECORD_AUDIO || true
            adb shell pm grant com.oyasumi.recorder android.permission.POST_NOTIFICATIONS || true
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            set +e
            FAIL=0
            run_class() {
              CLASS="$1"
              SAFE="$2"
              adb logcat -c
              timeout 600s adb shell am instrument -w -r -e class "$CLASS" com.oyasumi.recorder.test/androidx.test.runner.AndroidJUnitRunner                 | tee "../emulator-artifact/${SAFE}.txt"
              STATUS=${PIPESTATUS[0]}
              adb logcat -d > "../emulator-artifact/${SAFE}-logcat.txt" 2>&1 || true
              if [ "$STATUS" -ne 0 ] || grep -Eq 'FAILURES|INSTRUMENTATION_FAILED|FAIL:' "../emulator-artifact/${SAFE}.txt"; then FAIL=1; fi
            }
            run_class com.oyasumi.recorder.DesignSmokeTest design
            run_class com.oyasumi.recorder.PlaylistIntegrationTest playlist
            run_class com.oyasumi.recorder.RecordingIntegrationTest recording
            adb shell dumpsys activity activities > ../emulator-artifact/activity.txt 2>&1 || true
            adb shell dumpsys meminfo com.oyasumi.recorder > ../emulator-artifact/meminfo.txt 2>&1 || true
            for F in design-overview.png design-ranking.png actual-result.png; do
              adb exec-out run-as com.oyasumi.recorder cat cache/$F > ../emulator-artifact/$F 2>/dev/null || rm -f ../emulator-artifact/$F
            done
            exit $FAIL
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nemupino-3.6.3-emulator
          path: emulator-artifact/
          if-no-files-found: warn
