name: Validate Pokepino Runtime

on:
  push:
    branches: [ "main", "test/runtime-validation-20261005" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  recognition-eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install evaluation dependencies
        run: python -m pip install --disable-pip-version-check requests pillow numpy onnxruntime
      - name: Evaluate recognition on held-out transforms
        run: python tools/evaluate_recognition.py --sample 180 --model-sample 120
      - name: Evaluate four-frame grouped-reference scan on a fresh 100-photo holdout
        run: python tools/evaluate_embedding_framing.py 20261016
      - uses: actions/upload-artifact@v4
        with:
          name: pokepino-recognition-eval
          path: |
            recognition_eval.json
            embedding_framing_eval.json
          if-no-files-found: error

  emulator-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Validate database before runtime test
        run: python3 tools/validate_catalog.py
      - name: Run Android emulator UI smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace
