name: Validate Pokepino Runtime

on:
  push:
    branches: [ "main", "test/runtime-validation-20261005", "feat/collection-catalog-20261013" ]
  workflow_dispatch:

jobs:
  emulator-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Validate database before runtime test
        run: python3 tools/validate_catalog.py
      - name: Validate historical catalog
        run: python3 tools/validate_historical_collection.py
      - name: Validate collection JavaScript
        run: python3 tools/validate_collection_ui.py
      - name: Validate cutoff and catalog gaps
        run: python3 tools/validate_cutoff_and_gap_audit.py
      - name: Run Android emulator UI smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace
