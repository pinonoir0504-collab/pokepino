name: Build High Accuracy Recognition Assets

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ "feat/recognition-v3" ]
    paths:
      - "tools/build_embedding_catalog.py"
      - ".github/workflows/build-recognition-assets.yml"
      - "app/src/main/assets/catalog_v2.json"

concurrency:
  group: pokepino-recognition-assets
  cancel-in-progress: true

jobs:
  build-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check requests pillow numpy onnx
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - name: Build embedding model and multi-prototype database
        run: python tools/build_embedding_catalog.py
      - name: Validate generated assets
        run: python tools/validate_catalog.py
      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "pokepino-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/assets/mobilenet_v3_small_features.onnx                   app/src/main/assets/embedding_catalog_v3.json                   recognition_assets_stats.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate high accuracy recognition assets"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pokepino-recognition-v3-assets
          path: |
            app/src/main/assets/mobilenet_v3_small_features.onnx
            app/src/main/assets/embedding_catalog_v3.json
            recognition_assets_stats.json
          if-no-files-found: error
