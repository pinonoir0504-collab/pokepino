name: Build SBI Investment Dashboard APK

on:
  push:
    branches:
      - sbi-invest-dashboard-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sbi-invest-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore dashboard asset
        run: |
          base64 -d app/src/main/assets/index.html.gz.b64 > app/src/main/assets/index.html.gz
          gunzip -f app/src/main/assets/index.html.gz
          test -s app/src/main/assets/index.html

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SBI-Investment-Dashboard-v1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SBI-Investment-Dashboard-APK
          path: sbi-invest-app/app/build/outputs/apk/debug/SBI-Investment-Dashboard-v1.0.0.apk
          if-no-files-found: error
