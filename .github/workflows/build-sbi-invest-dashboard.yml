name: Build SBI Investment Dashboard v3.5 APK

on:
  push:
    branches:
      - sbi-invest-dashboard-v35
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sbi-invest-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore exact v3.1 dashboard assets
        run: |
          cat app/src/main/assets/v31_index.b64.* | base64 -d > app/src/main/assets/index.html.gz
          gunzip -f app/src/main/assets/index.html.gz
          cat app/src/main/assets/v31_css.b64.* | base64 -d > app/src/main/assets/app.css.gz
          gunzip -f app/src/main/assets/app.css.gz
          cat app/src/main/assets/v31_js.b64.* | base64 -d > app/src/main/assets/app.js.gz
          gunzip -f app/src/main/assets/app.js.gz
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/app.css
          test -s app/src/main/assets/app.js

      - name: Apply v3.2 patches
        run: |
          base64 -d v32patch/index.patch.gz.b64 > /tmp/v32-index.patch.gz
          gunzip -c /tmp/v32-index.patch.gz > /tmp/v32-index.patch
          base64 -d v32patch/css.patch.gz.b64 > /tmp/v32-css.patch.gz
          gunzip -c /tmp/v32-css.patch.gz > /tmp/v32-css.patch
          base64 -d v32patch/app.patch.gz.b64 > /tmp/v32-app.patch.gz
          gunzip -c /tmp/v32-app.patch.gz > /tmp/v32-app.patch
          patch app/src/main/assets/index.html < /tmp/v32-index.patch
          patch app/src/main/assets/app.css < /tmp/v32-css.patch
          patch app/src/main/assets/app.js < /tmp/v32-app.patch

      - name: Apply v3.3 patches
        run: |
          base64 -d v33patch/index.patch.gz.b64 > /tmp/v33-index.patch.gz
          gunzip -c /tmp/v33-index.patch.gz > /tmp/v33-index.patch
          base64 -d v33patch/css.patch.gz.b64 > /tmp/v33-css.patch.gz
          gunzip -c /tmp/v33-css.patch.gz > /tmp/v33-css.patch
          cat v33patch/app.patch.gz.b64.00 v33patch/app.patch.gz.b64.01 | base64 -d > /tmp/v33-app.patch.gz
          gunzip -c /tmp/v33-app.patch.gz > /tmp/v33-app.patch
          patch app/src/main/assets/index.html < /tmp/v33-index.patch
          patch app/src/main/assets/app.css < /tmp/v33-css.patch
          patch app/src/main/assets/app.js < /tmp/v33-app.patch

      - name: Apply v3.4 patches
        run: |
          base64 -d v34patch/index.patch.gz.b64 > /tmp/v34-index.patch.gz
          gunzip -c /tmp/v34-index.patch.gz > /tmp/v34-index.patch
          base64 -d v34patch/css.patch.gz.b64 > /tmp/v34-css.patch.gz
          gunzip -c /tmp/v34-css.patch.gz > /tmp/v34-css.patch
          cat v34patch/app.patch.gz.b64.00 v34patch/app.patch.gz.b64.01 v34patch/app.patch.gz.b64.02 | base64 -d > /tmp/v34-app.patch.gz
          gunzip -c /tmp/v34-app.patch.gz > /tmp/v34-app.patch
          patch app/src/main/assets/index.html < /tmp/v34-index.patch
          patch app/src/main/assets/app.css < /tmp/v34-css.patch
          patch app/src/main/assets/app.js < /tmp/v34-app.patch

      - name: Apply v3.5 design patches
        run: |
          base64 -d v35patch/index.patch.gz.b64 > /tmp/v35-index.patch.gz
          gunzip -c /tmp/v35-index.patch.gz > /tmp/v35-index.patch
          base64 -d v35patch/css.patch.gz.b64 > /tmp/v35-css.patch.gz
          gunzip -c /tmp/v35-css.patch.gz > /tmp/v35-css.patch
          base64 -d v35patch/app.patch.gz.b64 > /tmp/v35-app.patch.gz
          gunzip -c /tmp/v35-app.patch.gz > /tmp/v35-app.patch
          patch app/src/main/assets/index.html < /tmp/v35-index.patch
          patch app/src/main/assets/app.css < /tmp/v35-css.patch
          patch app/src/main/assets/app.js < /tmp/v35-app.patch

      - name: Validate v3.5 markers
        run: |
          grep -q "投資成績 v3.5.0" app/src/main/assets/index.html
          grep -q "favoriteFilter" app/src/main/assets/index.html
          grep -q "haptics" app/src/main/assets/index.html
          grep -q "bindSwipeAction" app/src/main/assets/app.js
          grep -q "bindPullRefresh" app/src/main/assets/app.js
          grep -q "suspiciousPerk" app/src/main/assets/app.js
          grep -q "toggleFavorite" app/src/main/assets/app.js
          grep -q "renderVirtualTable" app/src/main/assets/app.js
          grep -q "bindChartScrub" app/src/main/assets/app.js
          grep -q "handleAndroidBack" app/src/main/assets/app.js
          grep -q "versionName '3.5.0'" app/build.gradle
          grep -q "public void vibrate" app/src/main/java/com/pinori/investdashboard/MainActivity.java
          grep -q "PORTFOLIO PERFORMANCE" app/src/main/assets/index.html
          grep -q "midnight glass redesign" app/src/main/assets/app.css

      - name: Validate JavaScript
        run: node --check app/src/main/assets/app.js

      - name: Validate UI references
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          root=Path('app/src/main/assets')
          js=(root/'app.js').read_text()
          html=(root/'index.html').read_text()
          ids=set(re.findall(r"\$\('#([^']+)'\)",js))
          htmlids=set(re.findall(r'id="([^"]+)"',html))
          missing=sorted(ids-htmlids)
          if missing:
              raise SystemExit(f'Missing HTML IDs: {missing}')
          allids=re.findall(r'id="([^"]+)"',html)
          dup=sorted({x for x in allids if allids.count(x)>1})
          if dup:
              raise SystemExit(f'Duplicate HTML IDs: {dup}')
          print(f'UI references OK: {len(ids)} IDs')
          PY

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SBI-Investment-Dashboard-v3.5.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SBI-Investment-Dashboard-v3.5-APK
          path: sbi-invest-app/app/build/outputs/apk/debug/SBI-Investment-Dashboard-v3.5.0.apk
          if-no-files-found: error
