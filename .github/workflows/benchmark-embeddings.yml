name: Benchmark Marketplace Embeddings

on:
  push:
    branches: [ "audit/web-500-recognition" ]
    paths:
      - "tools/benchmark_marketplace_embeddings.py"
      - ".github/workflows/benchmark-embeddings.yml"
  workflow_dispatch:

concurrency:
  group: marketplace-embedding-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pillow numpy onnxruntime torch torchvision beautifulsoup4
      - name: Build fixed 500-image marketplace audit
        run: python tools/audit_marketplace_500.py
      - name: Benchmark semantic image embeddings
        run: python tools/benchmark_marketplace_embeddings.py
      - uses: actions/upload-artifact@v4
        with:
          name: pokepino-embedding-benchmark
          path: embedding_benchmark.json
          if-no-files-found: error
