name: Deploy Glyph Spin Arena

on:
  push:
    branches: ["main"]
    paths:
      - "web/glyph-spin/**"
      - ".github/workflows/deploy-glyph-spin.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "glyph-spin-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/glyph-spin
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
