name: NemuPino signing tools
on:
  push:
    branches:
      - nemupino-build-temp
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Collect Android build tools
        shell: bash
        run: |
          set -euo pipefail
          ZIPALIGN="$(find /usr/local/lib/android/sdk/build-tools -type f -name zipalign | sort -V | tail -n 1)"
          test -n "$ZIPALIGN"
          DIR="$(dirname "$ZIPALIGN")"
          LIBCPP="$(find "$DIR" -type f -name 'libc++.so' | head -n 1)"
          test -n "$LIBCPP"
          mkdir -p out
          cp "$ZIPALIGN" out/zipalign
          cp "$LIBCPP" out/libc++.so
          cp "$DIR/lib/apksigner.jar" out/apksigner.jar
          cp "$DIR/aapt2" out/aapt2
          chmod +x out/zipalign out/aapt2
      - uses: actions/upload-artifact@v4
        with:
          name: nemupino-signing-tools
          path: out/
          if-no-files-found: error
