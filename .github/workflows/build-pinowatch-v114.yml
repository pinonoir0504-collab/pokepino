name: Build PinoWatch v1.14.0 fixed

on:
  push:
    branches: [ "pinowatch-build-v114" ]
    paths:
      - ".github/workflows/build-pinowatch-v114.yml"
      - "pinowatch-build/PinoWatch_v1.14.0_fixed.zip"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Verify and extract source
        shell: bash
        run: |
          set -euo pipefail
          echo "1ccaa3e13af6fe5cefea0ae50bfd2178bb15af88e1e792e01c412c68009f1e46  pinowatch-build/PinoWatch_v1.14.0_fixed.zip" | sha256sum -c -
          unzip -t pinowatch-build/PinoWatch_v1.14.0_fixed.zip
          mkdir -p /tmp/pinowatch
          unzip -q pinowatch-build/PinoWatch_v1.14.0_fixed.zip -d /tmp/pinowatch

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Static source checks
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/pinowatch
          node --check app/src/main/assets/app.js
          python3 -c 'import json,xml.etree.ElementTree as ET; json.load(open("app/google-services.json",encoding="utf-8")); ET.parse("app/src/main/AndroidManifest.xml"); print("JSON/XML static checks: PASS")'
          grep -q 'versionName = "1.14.0"' app/build.gradle.kts
          grep -q 'versionCode = 14' app/build.gradle.kts
          grep -q 'PackageManager.PERMISSION_GRANTED' app/src/main/java/com/tdwatch/stockwatchv4/MainActivity.java
          grep -q 'EarningsReminderReceiver' app/src/main/AndroidManifest.xml
          grep -q 'KEY_LAST_DAY = "last_fetch_day"' app/src/main/java/com/tdwatch/stockwatchv4/EarningsScheduleService.java
          grep -q 'HOUR_OF_DAY, 20' app/src/main/java/com/tdwatch/stockwatchv4/EarningsReminderReceiver.java

      - name: Assemble debug APK
        working-directory: /tmp/pinowatch
        run: gradle :app:assembleDebug --stacktrace

      - name: Android lint
        working-directory: /tmp/pinowatch
        run: gradle :app:lintDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/pinowatch/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.tdwatch.stockwatchv4'" /tmp/apk-badging.txt
          grep -q "versionName='1.14.0'" /tmp/apk-badging.txt
          sha256sum "$APK" | tee /tmp/apk-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PinoWatch-v1.14.0-debug-apk
          path: /tmp/pinowatch/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
