name: Build PinoWatch Android v1.17.22

on:
  push:
    branches: [pinowatch-android-v11720-ci]
    paths:
      - ".github/workflows/build-pinowatch-android-v11720.yml"
      - "pinowatch-android/source_v11720.zip.b64"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source and check hash
        shell: bash
        run: |
          set -euo pipefail
          base64 -d pinowatch-android/source_v11720.zip.b64 > /tmp/pinowatch11720.zip
          echo 'b4f5049e6dc46692aa870196621f8ecdf74dff13f65a217f7a427cd4ccd4bdfc  /tmp/pinowatch11720.zip' | sha256sum -c -
          unzip -t /tmp/pinowatch11720.zip
          mkdir -p /tmp/pinowatch11720
          unzip -q /tmp/pinowatch11720.zip -d /tmp/pinowatch11720
          sed -i 's|@android:drawable/ic_menu_view|@drawable/ic_launcher|' /tmp/pinowatch11720/app/src/main/AndroidManifest.xml
          mkdir -p /tmp/pinowatch11720/app/src/main/res/drawable
          cp /tmp/pinowatch11720/app/src/main/assets/pinowatch-logo.webp /tmp/pinowatch11720/app/src/main/res/drawable/ic_launcher.webp
          node --check /tmp/pinowatch11720/app/src/main/assets/app.js
          node --check /tmp/pinowatch11720/app/src/main/assets/ios-adapter.js
          python3 -c 'import xml.etree.ElementTree as E; E.parse("/tmp/pinowatch11720/app/src/main/AndroidManifest.xml"); print("Android XML: OK")'
      - name: Add conservative market data validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          app=Path('/tmp/pinowatch11720/app/src/main/assets/app.js')
          s=app.read_text()
          marker_start='// Logo-only market dashboard'
          assert s.count(marker_start)==1
          before,after=s.split(marker_start,1)
          assert before.rstrip().endswith('})();')
          before=before.rstrip()[:-4]
          s=before+marker_start+after
          assert "addEventListener('click',showSecret);" in s
          s=s.replace("addEventListener('click',showSecret);", """addEventListener('click',()=>{const now=Date.now();if(now-window.__pinoLastLogoTap<500){window.__pinoLastLogoTap=0;showSecret()}else{window.__pinoLastLogoTap=now}});""",1)
          s+='\\n})();\\n'
          assert s.count('function showSecret()')==1
          marker="function secretFavorites(){"
          guard="""function validateMarketRow(row){
           const x={...row};
           const good=v=>v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v));
           const pos=v=>good(v)&&Number(v)>0;
           if(!pos(x.close)){x.close=null;x.change=null;x.changePercent=null;x.forecastDividendYield=null;}
           if(!pos(x.previousClose)||!pos(x.close)){x.change=null;x.changePercent=null;}
           else {
             const change=Number(x.close)-Number(x.previousClose);
             const pct=100*change/Number(x.previousClose);
             const tolerance=Math.max(.02,Number(x.close)*.0001);
             if((good(x.change)&&Math.abs(Number(x.change)-change)>tolerance)||
                (good(x.changePercent)&&Math.abs(Number(x.changePercent)-pct)>.08)){
                  x.change=null;x.changePercent=null;
             }
           }
           if(x.forecastDividendYield!=null&&(!good(x.forecastDividendYield)||Number(x.forecastDividendYield)<0||Number(x.forecastDividendYield)>30))x.forecastDividendYield=null;
           if(pos(x.annualDividend)&&pos(x.close)&&good(x.forecastDividendYield)&&
              Math.abs(Number(x.annualDividend)/Number(x.close)*100-Number(x.forecastDividendYield))>.15)x.forecastDividendYield=null;
           if(!pos(x.dayLow)||!pos(x.dayHigh)||Number(x.dayLow)>Number(x.dayHigh)){
             x.dayLow=null;x.dayHigh=null;x.previousRecord=null;x.recordChangePercent=null;
           }
           return x;
          }
          """
          assert marker in s
          s=s.replace(marker,guard+marker,1)
          old="secretItems=Array.isArray(data.items)?data.items:[];"
          assert old in s
          s=s.replace(old,"secretItems=Array.isArray(data.items)?data.items.map(validateMarketRow):[];",1)
          app.write_text(s)
          grad=Path('/tmp/pinowatch11720/app/build.gradle.kts')
          txt=grad.read_text().replace('versionCode = 11720','versionCode = 11722').replace('versionName = "1.17.20"','versionName = "1.17.22"')
          grad.write_text(txt)
          PY
          node --check /tmp/pinowatch11720/app/src/main/assets/app.js
          grep -q "window.__pinoLastLogoTap" /tmp/pinowatch11720/app/src/main/assets/app.js
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: /tmp/pinowatch11720
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify installable APK
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/pinowatch11720/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/pinowatch-badging.txt
          grep -q "package: name='jp.pinowatch.app'" /tmp/pinowatch-badging.txt
          grep -q "versionName='1.17.22'" /tmp/pinowatch-badging.txt
          mkdir -p /tmp/pinowatch-apk
          cp "$APK" /tmp/pinowatch-apk/PinoWatch_Android_v1.17.22.apk
          sha256sum /tmp/pinowatch-apk/PinoWatch_Android_v1.17.22.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PinoWatch-Android-v1.17.22-APK
          path: /tmp/pinowatch-apk/PinoWatch_Android_v1.17.22.apk
          if-no-files-found: error
