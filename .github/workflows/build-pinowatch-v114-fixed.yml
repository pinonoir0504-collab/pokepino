name: Build PinoWatch v1.14.0 fixed

on:
  push:
    branches: [ "pinowatch-build-v114" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and repair source layout
        shell: bash
        run: |
          set -euo pipefail
          cat pinowatch-build/payload/pw114_part_* > /tmp/pw114.b64
          base64 -d /tmp/pw114.b64 > /tmp/PinoWatch.zip
          echo "e220c95c46ba4d75db72b7209c8dcaaac96cd3b4ae747deb163f069dbfe5961d  /tmp/PinoWatch.zip" | sha256sum -c -
          unzip -t /tmp/PinoWatch.zip
          mkdir -p /tmp/pinowatch
          unzip -q /tmp/PinoWatch.zip -d /tmp/pinowatch
          if [ -f /tmp/pinowatch/app/AndroidManifest.xml ]; then
            mkdir -p /tmp/pinowatch/app/src/main
            mv /tmp/pinowatch/app/AndroidManifest.xml /tmp/pinowatch/app/src/main/AndroidManifest.xml
          fi
          test -f /tmp/pinowatch/app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/pinowatch
          node --check app/src/main/assets/app.js
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          json.load(open("app/google-services.json", encoding="utf-8"))
          ET.parse("app/src/main/AndroidManifest.xml")
          print("static checks PASS")
          PY
          grep -q 'versionName = "1.14.0"' app/build.gradle.kts
          grep -q 'versionCode = 14' app/build.gradle.kts
          grep -q 'EarningsReminderReceiver' app/src/main/AndroidManifest.xml
          grep -q 'KEY_LAST_DAY = "last_fetch_day"' app/src/main/java/com/tdwatch/stockwatchv4/EarningsScheduleService.java
          grep -q 'HOUR_OF_DAY, 20' app/src/main/java/com/tdwatch/stockwatchv4/EarningsReminderReceiver.java

      - name: Build
        shell: bash
        run: |
          cd /tmp/pinowatch
          gradle :app:assembleDebug --stacktrace

      - name: Lint
        shell: bash
        run: |
          cd /tmp/pinowatch
          gradle :app:lintDebug --stacktrace

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/pinowatch/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.tdwatch.stockwatchv4'" /tmp/badging.txt
          grep -q "versionName='1.14.0'" /tmp/badging.txt
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: PinoWatch-v1.14.0-debug-apk
          path: /tmp/pinowatch/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
