name: NemuPino fast device verification

on:
  push:
    branches:
      - nemupino-build-temp

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_class: com.oyasumi.recorder.DesignSmokeTest#resultLayoutAndRankingOpen
            safe: ui
          - test_class: com.oyasumi.recorder.RecordingIntegrationTest#shortRotationsProduceCheckpointsThenOnePlayableFinalSession
            safe: record-save
          - test_class: com.oyasumi.recorder.RecordingIntegrationTest#rangeCompletionCanChainPlaybackWithoutStaleCallbacks
            safe: playback
          - test_class: com.oyasumi.recorder.RecordingIntegrationTest#zzResultControlsAndManualLabelsWork
            safe: labels
          - test_class: com.oyasumi.recorder.RecordingIntegrationTest#analysisPreservesEditsAndDoesNotResurrectDeletedRecords
            safe: analysis
          - test_class: com.oyasumi.recorder.PlaylistIntegrationTest#playbackCrossesPartsAndCrossPartSeekKeepsPauseChoice
            safe: playlist
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Unpack
        shell: bash
        run: |
          rm -rf nemupino-ci diag
          mkdir nemupino-ci diag
          unzip -q .nemupino-build/source.zip -d nemupino-ci
          cp .nemupino-build/SoundCandidates.kt nemupino-ci/app/src/main/java/com/oyasumi/recorder/SoundCandidates.kt
      - name: Run one device scenario
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86
          profile: Nexus 5X
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -camera-back none -camera-front none -noaudio
          script: |
            set -o pipefail
            cd nemupino-ci
            gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant com.oyasumi.recorder android.permission.RECORD_AUDIO || true
            set +e
            timeout 300s adb shell am instrument -w -r -e class "${{ matrix.test_class }}" com.oyasumi.recorder.test/androidx.test.runner.AndroidJUnitRunner | tee ../diag/instrumentation.txt
            STATUS=${PIPESTATUS[0]}
            adb logcat -d > ../diag/logcat.txt 2>&1 || true
            adb shell dumpsys meminfo com.oyasumi.recorder > ../diag/meminfo.txt 2>&1 || true
            for F in design-overview.png design-ranking.png actual-result.png; do
              adb exec-out run-as com.oyasumi.recorder cat cache/$F > ../diag/$F 2>/dev/null || rm -f ../diag/$F
            done
            if grep -Eq 'FAILURES|INSTRUMENTATION_FAILED|FAIL:' ../diag/instrumentation.txt; then exit 1; fi
            exit $STATUS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nemupino-fast-${{ matrix.safe }}
          path: diag/
          if-no-files-found: warn
