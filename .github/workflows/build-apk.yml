name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feat/recognition-v3", "feat/collection-catalog-20261013" ]

concurrency:
  group: pokepino-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk -type f -name sdkmanager | head -n 1)"
          echo "sdkmanager=$SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate figure database
        run: python3 tools/validate_catalog.py
      - name: Validate new collection catalog
        run: python3 tools/validate_official_collection.py
      - name: Triple-check product/photo coverage
        run: python3 tools/audit_collection.py
      - name: Validate historical variants and official image galleries
        run: python3 tools/validate_historical_collection.py
      - name: Validate collection JavaScript
        run: python3 tools/validate_collection_ui.py
      - name: Validate cutoff and ten-machine followup index
        run: python3 tools/validate_cutoff_and_gap_audit.py
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pokepino-v1.5.0-oct2026-cutoff-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            collection_audit.json
          if-no-files-found: error
